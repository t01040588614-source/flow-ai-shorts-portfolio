# This file is copied to /etc/nginx/conf.d/default.conf, which nginx includes inside http {}.
# `map` is only allowed there (http context), so it stays outside the server block.

# nginx's stock mime.types has no ttf or webmanifest: fonts went out as
# application/octet-stream (so gzip skipped them) and so did the app manifest.
# A types block at http level adds to the stock list instead of replacing it.
types {
    font/ttf ttf;
    application/manifest+json webmanifest;
}

# Unknown paths → HTTP 404 with the static 404.html. Known SPA + prerender dirs → shell HTML.
# Keep this list in step with the routes in src/app (a route missing here answers 404).
map $uri $spa_entry {
    default /__not_found;
    / /index.html;
    ~^/(pricing|about|faq|guide|support|privacy|terms|create|timeline|projects|account|dashboard|shorts|assistant|admin|verify-email|reset-password)/?$ /index.html;
    ~^/timeline/ /index.html;
    ~^/support/thanks/ /index.html;
    ~^/support/mine /index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Editor assets ≤80MB; longform chunks ≤16MB. Default nginx is 1m.
    client_max_body_size 100m;
    client_body_timeout 300s;

    # Behind a port map (127.0.0.1:8080 → 80) or Caddy, an absolute redirect would point
    # at port 80 over http. A relative Location keeps the host, port and scheme the browser used.
    absolute_redirect off;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Fonts are TTF (about 13 MB in total); they shrink by about half.
    gzip_types text/css text/plain application/javascript application/json application/manifest+json
        image/svg+xml font/ttf application/x-font-ttf application/font-sfnt;

    # The API sets its own security headers; ^~ keeps the static-file regex below off /api/*.mp4.
    # A name in a variable is looked up again (Docker's DNS, 10 s cache) instead of once at start:
    # otherwise a deploy that recreates only the api container leaves nginx on the old address
    # and every API call answers 502 until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ {
        set $api_upstream http://api:8800;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Play Store app (TWA) ownership check. Must be served as JSON, without redirects.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Vite puts a content hash in every file name here, so a file never changes.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts, demo clips, og images, icons: same name can change on deploy, so 30 days only.
    location ~* \.(?:ttf|woff2?|mp4|webm|png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker must be re-checked on every visit or app updates get stuck.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # try_files ends in a URI, which would answer 200; this turns an unknown path into a
    # real 404, and error_page above then serves 404.html with that status.
    location = /__not_found {
        internal;
        return 404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML pages. nginx drops server-level add_header in any location that has its own,
    # so the page headers live here. CSP is report-only first: violations show in the
    # browser console without breaking Toss checkout; switch to enforcing once it is clean.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-2kplf/5yKou0Lscn5a8rj3SCVkF7f18rnoftFZn4LBI=' https://js.tosspayments.com; connect-src 'self' https://*.tosspayments.com; frame-src https://*.tosspayments.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://*.tosspayments.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        # /pricing → pricing/index.html directly (no redirect to /pricing/, which the
        # canonical URL does not use). "/" and "/pricing/" match the directory via $uri.
        try_files $uri $uri/index.html $spa_entry;
    }
}
