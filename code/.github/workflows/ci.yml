name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -c constraints.txt -r requirements-dev.txt
          pip install --no-deps mediapipe==1.1.1
          pip install -r requirements-mediapipe.txt

      - name: Lint
        run: ruff check app tests scripts

      # Same as backend/Dockerfile: the timeline renderer needs ffmpeg with drawtext
      # (the imageio-ffmpeg Linux build has none) and Korean fonts.
      - name: Install ffmpeg and Korean fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Run pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke check
        run: npm run test:smoke
